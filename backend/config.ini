# ==========================================================================
# Synora Bridge (Django backend) — configuration file
#
# Same structure as the original Flask config.ini. The two most important
# flags are in [Server]:
#   environment = development  → SQLite only (locked; [POSTGRES] never used)
#   environment = production   → hardened; the database engine is the section
#                                whose `enabled = true`: [POSTGRES] (requires
#                                a working connection — the Settings GUI
#                                verifies it before saving the switch) or
#                                [SQLITE] (standalone default, auto-creates
#                                the DB). Exactly one must be enabled.
#
# The backend reads this file at startup via config.ini_config.load_ini().
# ==========================================================================

[Server]
host = 127.0.0.1
port = 8000
debug = false
environment = production
# Global timezone (IANA name). Must be a valid zone — the app fails fast on a
# typo. Each bridge template can override this per-template via its API field.
# Requires the tzdata package (in requirements.txt) on Windows.
timezone = Asia/Kolkata
allowed_hosts = 127.0.0.1,localhost

[POSTGRES]
# enabled = true selects PostgreSQL in production (requires a verified
# connection — the Settings GUI tests it before saving the switch).
enabled = true
host = localhost
port = 5432
database = bridge_db
username = bridge_user
password = synora

[SQLITE]
# enabled = true selects SQLite (development always uses SQLite regardless;
# this flag decides the engine when environment = production).
enabled = false
path = instance
database = bridge_app.db

[CELERY]
broker_url = redis://localhost:6379/0
result_backend = redis://localhost:6379/1
always_eager = false
task_timezone = Asia/Kolkata
# Windows: Celery's default prefork pool fails (PermissionError WinError 5 +
# no SIGUSR1 for soft timeouts). Run workers with: celery -A config.celery
# worker --pool=solo --concurrency=1   (or --pool=threads on Windows).
worker_concurrency = 4
worker_prefetch_multiplier = 4
task_acks_late = false
task_soft_time_limit = 120
task_time_limit = 180

[SECURITY]
secret_key = yk2ko1b4q1p&q1_+4$kbfoby$cis(o!*gd$r-4n#pc0l)*@%*r
encryption_key = KVKKBjAXkjoJ1LSKLhDohgfZc9/EngXeq90Hr8Cvpjw=
# secret_key / encryption_key may be left empty in development; production
# requires both (the app refuses to start without them).

[CORS]
allowed_origins = http://localhost:3000,http://127.0.0.1:3000

[UI]
theme = default
colormode = auto
layout = sidebar
date_format = DD/MM/YYYY HH:mm:ss

[OPENTELEMETRY]
enabled = false
otlp_endpoint = http://localhost:4318/v1/traces
service_name = synora-bridge
# Instrumentation toggles (requires opentelemetry packages installed):
# django = true, requests = true, celery = true, http = true
instrument_django = true
instrument_requests = true
instrument_celery = true
instrument_http = true

[RateLimit]
enabled = true
rate = 60
period = minute
# Applied to pull endpoints. Leave enabled=false for unlimited.

[Cache]
enabled = true
backend = redis
default_ttl_seconds = 15
# Short-TTL response cache for pull endpoints (Redis). Set enabled=false to
# bypass caching entirely.

[DatabasePool]
enabled = false
max_age_seconds = 60
# Connection pooling: use CONN_MAX_AGE in Django + PgBouncer in front of
# PostgreSQL. Config template: deploy/pgbouncer.ini

[ReverseProxy]
enabled = false
# nginx/caddy TLS + gzip + static caching in front of daphne.
# Config template: deploy/nginx.conf

[Logging]
log_dir = logs
rotation = midnight
backup_count = 30

[RetryQueue]
retention_minutes = 60

[Swagger]
refresh_interval = 1
refresh_unit = hours

[Email]
mode = none
sender_email = noreply@bridge.local
recipient_emails =
smtp_host = smtp.gmail.com
smtp_port = 587
smtp_user =
smtp_password =
throttle_enabled = false
throttle_minutes = 60
