# ==========================================================================
# TEST-ONLY configuration — hermetic dev/SQLite fixture used by the pytest
# suite (backend/config/test_settings.py points here). The test suite must
# never depend on the developer's real backend/config.ini, which may be
# production + PostgreSQL with empty [SECURITY] keys.
# ==========================================================================

[Server]
host = 127.0.0.1
port = 8000
debug = true
environment = development
timezone = Asia/Kolkata
allowed_hosts = 127.0.0.1,localhost

[POSTGRES]
enabled = false
host = localhost
port = 5432
database = bridge_db
username = postgres
password = 

[SQLITE]
enabled = true
path = instance
database = bridge_app.db

[CELERY]
broker_url = redis://localhost:6379/0
result_backend = redis://localhost:6379/1
always_eager = true
task_timezone = Asia/Kolkata
worker_concurrency = 4
worker_prefetch_multiplier = 4
task_acks_late = false
task_soft_time_limit = 120
task_time_limit = 180

[SECURITY]
secret_key = 
encryption_key = 

[CORS]
allowed_origins = http://localhost:3000,http://127.0.0.1:3000

[UI]
theme = default
colormode = auto
layout = sidebar
date_format = DD/MM/YYYY HH:mm:ss

[OPENTELEMETRY]
enabled = false
otlp_endpoint = http://localhost:4318/v1/traces
service_name = synora-bridge
instrument_django = true
instrument_requests = true
instrument_celery = true
instrument_http = true

[RateLimit]
enabled = true
rate = 60
period = minute

[Cache]
enabled = true
backend = redis
default_ttl_seconds = 15

[DatabasePool]
enabled = false
max_age_seconds = 60

[ReverseProxy]
enabled = false

[Logging]
log_dir = logs
rotation = midnight
backup_count = 30

[RetryQueue]
retention_minutes = 60

[Swagger]
refresh_interval = 1
refresh_unit = hours

[Email]
mode = none
sender_email = noreply@bridge.local
recipient_emails = 
smtp_host = smtp.gmail.com
smtp_port = 587
smtp_user = 
smtp_password = 
throttle_enabled = false
throttle_minutes = 60
