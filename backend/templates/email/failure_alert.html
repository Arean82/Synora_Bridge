"""Django email template for scheduled job failure alerts."""
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Schedule Failure Alert</title>
    <style>
        body { font-family: Segoe UI, Arial, sans-serif; background: #f4f4f5; margin: 0; padding: 24px; }
        .card { background: #ffffff; border-radius: 10px; padding: 24px; max-width: 640px; margin: 0 auto; border: 1px solid #e4e4e7; }
        h2 { color: #dc2626; margin-top: 0; }
        .label { color: #71717a; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
        .value { margin: 0 0 16px; color: #18181b; word-break: break-word; }
        pre { background: #f4f4f5; border-radius: 6px; padding: 12px; overflow-x: auto; font-size: 12px; }
        .footer { color: #a1a1aa; font-size: 12px; margin-top: 24px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Schedule Failure Alert</h2>
        <div class="label">Job ID</div>
        <p class="value">{{ job_id }}</p>
        <div class="label">Template</div>
        <p class="value">{{ template_name }}</p>
        <div class="label">Destination</div>
        <p class="value">{{ dest_url }}</p>
        <div class="label">Error</div>
        <pre>{{ error_msg }}</pre>
        <div class="label">Timestamp</div>
        <p class="value">{{ timestamp }}</p>
    </div>
    <div class="footer">Sent by Synora Bridge</div>
</body>
</html>
