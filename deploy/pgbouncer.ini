# PgBouncer configuration template (scale item #6)
#
# PgBouncer sits in front of PostgreSQL to pool connections. It is a
# deployment-time component — not part of the Django app. Django connects to
# PgBouncer's port (6432) instead of PostgreSQL's (5432).
#
# Enable via: backend/config.ini  [DatabasePool] enabled = true
# then point [POSTGRES] port at the PgBouncer port below.
#
# Reference: https://www.pgbouncer.org/config.html

[databases]
# dbname = host=127.0.0.1 port=5432 dbname=<POSTGRES.database>
bridge_db = host=127.0.0.1 port=5432 dbname=bridge_db

[pgbouncer]
# Listen on the port Django will connect to.
listen_addr = 127.0.0.1
listen_port = 6432

# Auth: use the same user/password as [POSTGRES] in config.ini.
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
# userlist.txt line format: "postgres" "yourpassword"

# Connection pooling model.
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5

# Server lifetime: keep-alive close to Django's CONN_MAX_AGE.
server_idle_timeout = 60
server_lifetime = 3600

# Logging.
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
admin_users = postgres
