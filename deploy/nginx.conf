# nginx reverse proxy template (scale item #8)
#
# nginx terminates TLS, serves gzip compression, static files and proxies to
# daphne (the Django ASGI server). Deployment-time component — not part of
# the Django app.
#
# Enable via: backend/config.ini  [ReverseProxy] enabled = true
# (in production the app then trusts X-Forwarded-* headers from nginx).

# --- HTTP -> HTTPS redirect ---
server {
    listen 80;
    server_name bridge.example.com;
    return 301 https://$host$request_uri;
}

# --- HTTPS site ---
server {
    listen 443 ssl http2;
    server_name bridge.example.com;

    ssl_certificate     /etc/letsencrypt/live/bridge.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bridge.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Large upstream payloads (pull endpoints can return big JSON).
    client_max_body_size 50m;

    # Static files served directly by nginx.
    location /static/ {
        alias /path/to/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # GraphiQL / Swagger UI assets are CDN-hosted; nothing extra needed.

    # Everything else -> daphne (Django ASGI on 127.0.0.1:8000).
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Channels live feed /ws/feed/<id>/).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout  86400;
        proxy_send_timeout  86400;
    }
}
